[project]
name = "tickstack"
version = "0.2.0"
description = "A tick research stack (Arrow/Parquet/DuckDB) benchmarked against pandas, Polars, ClickHouse and QuestDB on five canonical quant queries, every timing gated by a correctness oracle"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
polars = ["polars>=1.20"]
# Clients for the two server engines (servers themselves: docker compose up -d)
servers = ["clickhouse-connect>=0.8", "questdb>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "tickstack[polars,servers]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The queries modules intentionally embed multi-line SQL; long string lines are fine.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
